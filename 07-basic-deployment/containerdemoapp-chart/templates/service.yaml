apiVersion: v1
kind: Service
metadata:
  name: {{ include "containerdemoapp-chart.fullname" . }}
  labels:
    {{- include "containerdemoapp-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.ports }}
  ports:
  {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol | default "TCP" }}
  {{- end }}
  {{- else }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  {{- end }}
  selector:
    {{- include "containerdemoapp-chart.selectorLabels" . | nindent 4 }}
