# Default values for second-app-chart.
# NGINX-based second application for ingress demo

replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "alpine"

# Simple service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Container configuration
containerPort: 80

# Environment variables
env:
  - name: APP_NAME
    value: "Second Application"

# Disable features not needed for this simple demo
autoscaling:
  enabled: false

ingress:
  enabled: false

serviceAccount:
  create: false

# Minimal resource requirements
resources:
  requests:
    memory: "32Mi"
    cpu: "100m"
  limits:
    memory: "64Mi"
    cpu: "200m"

# Basic health probes for nginx
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
